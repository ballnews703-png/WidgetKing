# Native build on GitHub's free macOS runners (public repo = $0).
# Milestone 0 of the native plan: prove the pipeline — compile the app and
# its widget extension for the iOS Simulator, install and launch it there.
# No signing, no Apple Developer account involved.
name: ios

on:
  push:
    branches: ['**']
    paths:
      - 'WidgetKing/**'
      - 'WidgetKingWidgets/**'
      - 'Shared/**'
      - 'WidgetKing.xcodeproj/**'
      - 'WidgetKingTests/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Build app + widget extension for the Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project WidgetKing.xcodeproj \
            -scheme WidgetKing \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee build.log | grep -E 'error:|warning: unre|BUILD|Compiling|Linking' | tail -60

      - name: Boot a simulator, install and launch the app
        run: |
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find build -name 'WidgetKing.app' -path '*iphonesimulator*' | head -1)
          echo "app $APP"
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.widgetking.app
          sleep 5
          xcrun simctl io "$DEV" screenshot sim-launch.png
          xcrun simctl shutdown "$DEV" || true

      - name: Run tests (if a test target exists)
        run: |
          set -o pipefail
          if grep -q 'WidgetKingTests' WidgetKing.xcodeproj/project.pbxproj; then
            DEVNAME=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2' | head -1 | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')
            xcodebuild test -project WidgetKing.xcodeproj -scheme WidgetKing \
              -destination "platform=iOS Simulator,name=$DEVNAME" -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee test.log | grep -E 'Test Case|error:|TEST|Executed' | tail -120
          else
            echo "no test target yet (milestone 1 adds it)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            build.log
            test.log
            sim-launch.png
          if-no-files-found: ignore
