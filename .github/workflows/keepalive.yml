# Free Supabase projects pause after ~7 days without traffic. One tiny
# authenticated request a day counts as activity. The project URL and the
# public anon key are read from web/index.html so this never drifts from
# what the app itself uses (the anon key is public by design; see
# ACCOUNTS_SETUP.md — the service_role key is never stored anywhere).
name: supabase-keepalive

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping the project's REST endpoint
        run: |
          URL=$(grep -o 'const WK_SYNC_URL = "[^"]*"' web/index.html | sed -E 's/.*"([^"]*)"/\1/')
          KEY=$(grep -o 'const WK_SYNC_KEY = "[^"]*"' web/index.html | sed -E 's/.*"([^"]*)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "no sync project configured"; exit 0; fi
          echo "pinging $URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/designs?select=id&limit=1")
          echo "HTTP $code"
          # 200 = table exists and RLS answered; 401/404 still count as activity
          # (the table may not exist yet). Anything 5xx or 0 means the project
          # is paused or down — fail so it shows up in the Actions tab.
          case "$code" in 2*|401|404) exit 0 ;; *) exit 1 ;; esac
