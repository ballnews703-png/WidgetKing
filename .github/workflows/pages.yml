name: Deploy designer to GitHub Pages

# Manual trigger only — run it once the repository is public.
# (GitHub Pages is free on public repos; on private repos it needs a paid plan.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload designer
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages queue occasionally backs up for 10+ minutes; the
          # default 10-minute timeout then aborts a deploy that would have
          # landed. Wait up to 30 minutes before giving up.
          timeout: 1800000
