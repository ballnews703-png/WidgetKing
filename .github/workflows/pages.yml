name: Deploy designer to GitHub Pages

# Manual trigger only — run it once the repository is public.
# (GitHub Pages is free on public repos; on private repos it needs a paid plan.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload designer
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # deploy-pages hard-caps its wait at 10 minutes, and GitHub's Pages
      # queue occasionally backs up longer than that. Retrying the deploy
      # step (same artifact — a re-upload would trip deploy-pages' duplicate
      # artifact check) gives one run up to ~30 minutes of patience.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Deploy (retry 1)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Deploy (retry 2)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
